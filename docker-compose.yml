services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
    volumes:
      - ./packages/backend:/app
    command: uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped
